- name: Clean WFCatalog metrics for a given network/station/time range
  hosts: wf_catalogue
  gather_facts: no

  vars:
    venv_python: ".env/bin/python3.11"
    collector_script: "WFCatalogCollector.py"
    config_path: "{{ collector_dir }}/config.json"
    archive_root: "/home/sysop/iso_sds"

  tasks:

    - name: Ensure required variables are provided
      fail:
        msg: "You must pass 'network', 'station', 'starttime', and 'endtime' via -e"
      when: network is not defined or station is not defined or starttime is not defined or endtime is not defined

    - name: Set defaults for optional variables
      set_fact:
        file_suffix: 'D'
        network: "{{ network | default('*') }}"
        station: "{{ station | default('*') }}"
        location: "{{ location | default('*') }}"
        channel: "{{ channel | default('*') }}"

    - name: Compute basic derived values
      set_fact:
        start_date: "{{ starttime | regex_replace('T.*$', '') }}"
        end_date: "{{ endtime | regex_replace('T.*$', '') }}"

    - name: Compute secondary derived values
      set_fact:
        log_path: "{{ collector_dir }}/log/WFCatalog-clean-{{ network }}-{{ station }}-{{ start_date }}-{{ end_date }}.log"
        year_range: >-
          {{ range(
              (starttime | regex_replace('T.*$', '') | to_datetime('%Y-%m-%d')).year,
              (endtime | regex_replace('T.*$', '') | to_datetime('%Y-%m-%d')).year + 1
          ) | list }}

    - name: "DISPLAY CLEAN PARAMETERS"
      debug:
        msg:
          - "========================================"
          - " WFCatalog Clean — Parameters"
          - "========================================"
          - "  Host       : {{ inventory_hostname }}"
          - "  Network    : {{ network }}"
          - "  Station    : {{ station }}"
          - "  Location   : {{ location }}"
          - "  Channel    : {{ channel }}"
          - "  Start date : {{ start_date }}"
          - "  End date   : {{ end_date }}"
          - "  Year range : {{ year_range }}"
          - "  Log file   : {{ log_path }}"
          - "========================================"

    # ---------------------------------------------------------------
    # FILE DISCOVERY
    # ---------------------------------------------------------------

    - name: Generate list of -name patterns for DOY matching across years
      shell: |
        start="{{ start_date }}"
        end="{{ end_date }}"
        tmp_list=""

        start_epoch=$(date -d "$start" +%s)
        end_epoch=$(date -d "$end" +%s)
        days_diff=$(( (end_epoch - start_epoch) / 86400 ))

        for i in $(seq 0 $days_diff); do
          current_date=$(date -d "@$((start_epoch + i * 86400))" +%Y.%j)
          year=$(echo "$current_date" | cut -d. -f1)
          doy=$(echo "$current_date" | cut -d. -f2)
          tmp_list="$tmp_list -name '*.${year}.${doy}' -o"
        done

        echo "${tmp_list% -o}"
      args:
        executable: /bin/bash
      register: name_patterns
      changed_when: false

    - name: Set final find arguments
      set_fact:
        find_args: "{{ name_patterns.stdout }}"

    - name: Run find in correct SDS folders per year
      shell: >
        find {{ archive_root }}/{{ item }}/{ {{ network }} }/{ {{ station }} }/{ {{ channel }}.{{ file_suffix }} }/ -type f \( {{ find_args }} \)
      loop: "{{ year_range }}"
      args:
        executable: /bin/bash
      register: find_results
      changed_when: false
      ignore_errors: true

    - name: Collect found SDS file paths
      set_fact:
        all_files: >-
          {{ find_results.results | map(attribute='stdout_lines') | flatten | list }}

    - name: "DISPLAY FILE DISCOVERY RESULTS"
      debug:
        msg:
          - "========================================"
          - " WFCatalog Clean — File Discovery"
          - "========================================"
          - "  Total files found : {{ all_files | length }}"
          - "  First 10 files    :"
          - "{{ all_files[:10] | join('\n') }}"
          - "  ({{ [all_files | length - 10, 0] | max }} more not shown)"
          - "========================================"

    - name: Abort if no files found
      fail:
        msg: "No SDS files found for {{ network }}.{{ station }}.{{ location }}.{{ channel }} between {{ start_date }} and {{ end_date }}"
      when: all_files | length == 0

    # ---------------------------------------------------------------
    # CONFIG PATCH
    # ---------------------------------------------------------------

    - name: Check if backup exists
      stat:
        path: "{{ config_path }}.back"
      register: config_backup

    - name: Backup original config.json
      copy:
        src: "{{ config_path }}"
        dest: "{{ config_path }}.back"
        remote_src: true
      when: not config_backup.stat.exists

    - name: Read config.json before patch
      slurp:
        src: "{{ config_path }}"
      register: config_before

    - name: "DISPLAY WHITE FILTER BEFORE PATCH"
      debug:
        msg:
          - "========================================"
          - " WFCatalog Clean — config.json BEFORE patch"
          - "========================================"
          - "{{ (config_before.content | b64decode | from_json).FILTERS }}"
          - "========================================"

    - name: Update WHITE filter in config.json
      shell: |
        # Construct a JSON array of filters
        NETS="{{ network }}"
        STAS="{{ station }}"
        LOCS="{{ location }}"
        CHAS="{{ channel }}"
        
        if [[ "$NETS" == *","* || "$STAS" == *","* ]]; then
           FILTER_VAL=".*"
        else
           FILTER_VAL="${NETS}.${STAS}.${LOCS}.${CHAS}.*"
        fi
        
        sed -i -E "s/\"WHITE\":\s*\[\s*\".*?\"\s*\]/\"WHITE\": [\"$FILTER_VAL\"]/" {{ config_path }}
      args:
        executable: /bin/bash

    - name: Read config.json after patch
      slurp:
        src: "{{ config_path }}"
      register: config_after

    - name: "DISPLAY WHITE FILTER AFTER PATCH"
      debug:
        msg:
          - "========================================"
          - " WFCatalog Clean — config.json AFTER patch"
          - "========================================"
          - "{{ (config_after.content | b64decode | from_json).FILTERS }}"
          - "========================================"

    # ---------------------------------------------------------------
    # RUN COLLECTOR
    # ---------------------------------------------------------------

    - name: Save file list to temporary text file
      copy:
        content: "{{ all_files | join('\n') }}"
        dest: "/tmp/wfc_clean_{{ network }}_{{ station }}.txt"

    - name: Run WFCatalogCollector (clean)
      shell: |
        set -o pipefail
        cd {{ collector_dir }} && \
        LIST_JSON=$(cat /tmp/wfc_clean_{{ network }}_{{ station }}.txt | jq -R . | jq -s -c .) && \
        {{ venv_python }} {{ collector_script }} \
        --list "$LIST_JSON" \
        --flags --csegs \
        --logfile {{ log_path }} \
        --stdout \
        --delete 2>&1 | tee {{ log_path }}.live
      args:
        executable: /bin/bash
      async: 3600
      poll: 10
      register: wfcatalog_result

    - name: Read live log file after collector finishes
      slurp:
        src: "{{ log_path }}.live"
      register: live_log
      ignore_errors: true

    - name: "DISPLAY COLLECTOR STDOUT"
      debug:
        msg:
          - "========================================"
          - " WFCatalog Clean — Collector STDOUT"
          - "========================================"
          - "{{ wfcatalog_result.stdout | default('(no stdout)') }}"
          - "========================================"

    - name: "DISPLAY LIVE LOG CONTENTS"
      debug:
        msg:
          - "========================================"
          - " WFCatalog Clean — Live Log ({{ log_path }}.live)"
          - "========================================"
          - "{{ (live_log.content | b64decode) if live_log.content is defined else '(live log not found)' }}"
          - "========================================"

    - name: "DISPLAY COLLECTOR STDERR"
      debug:
        msg:
          - "========================================"
          - " WFCatalog Clean — Collector STDERR"
          - "========================================"
          - "{{ wfcatalog_result.stderr | default('(no stderr)') }}"
          - "========================================"

    - name: "DISPLAY EXIT CODE"
      debug:
        msg: "Collector exited with rc={{ wfcatalog_result.rc | default('unknown') }}"

    # ---------------------------------------------------------------
    # RESTORE CONFIG + JOB TRACKING
    # ---------------------------------------------------------------

    - name: Restore original config.json
      copy:
        src: "{{ config_path }}.back"
        dest: "{{ config_path }}"
        remote_src: true

    - name: Ensure ~/.dmtri/jobs/{{ inventory_hostname }} directory exists
      file:
        path: "~/.dmtri/jobs/{{ inventory_hostname }}"
        state: directory
        mode: '0755'

    - name: "Load existing job list (if exists)"
      slurp:
        src: "~/.dmtri/jobs/{{ inventory_hostname }}/wfcatalog.json"
      register: job_file
      ignore_errors: true

    - name: "Parse job list or default to []"
      set_fact:
        job_list: >-
          {{ (job_file.content | b64decode | from_json) if job_file.content is defined else [] }}

    - name: Define new job entry
      set_fact:
        new_job: {
          "type": "wfcatalog_clean",
          "job_id": "clean-{{ lookup('pipe', 'date +%s') }}",
          "host": "{{ inventory_hostname }}",
          "network": "{{ network }}",
          "station": "{{ station }}",
          "location": "{{ location }}",
          "channel": "{{ channel }}",
          "start": "{{ starttime }}",
          "end": "{{ endtime }}",
          "rc": "{{ wfcatalog_result.rc | default('unknown') }}",
          "files_processed": "{{ all_files | length }}",
          "created_at": "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"
        }

    - name: "Save updated job list"
      copy:
        content: "{{ (job_list + [new_job]) | to_nice_json }}"
        dest: "~/.dmtri/jobs/{{ inventory_hostname }}/wfcatalog.json"

    - name: "DISPLAY FINAL SUMMARY"
      debug:
        msg:
          - "========================================"
          - " WFCatalog Clean — DONE"
          - "========================================"
          - "  Files cleaned   : {{ all_files | length }}"
          - "  Exit code       : {{ wfcatalog_result.rc | default('unknown') }}"
          - "  Log file        : {{ log_path }}"
          - "  Job ID          : {{ new_job.job_id }}"
          - "========================================"