- name: Run seedpsd data load in simulate mode
  hosts: seedpsd_nodes
  gather_facts: false
  vars:
    description: "Runs seedpsd-cli data load in simulation mode"
  tasks:
    - name: Run seedpsd data load with simulate flag
      ansible.builtin.shell: >
        cd /home/qc/seedpsd && \
        uv run seedpsd-cli data load
        --simulate
        {% if network is defined %} --network "{{ network }}" {% endif %}
        {% if station is defined %} --station "{{ station }}" {% endif %}
        {% if location is defined %} --location "{{ location }}" {% endif %}
        {% if channel is defined %} --channel "{{ channel }}" {% endif %}
      args:
        executable: /bin/bash
      register: seedpsd_result
      ignore_errors: false

    - name: Show seedpsd-cli output
      ansible.builtin.debug:
        var: seedpsd_result.stdout_lines
      when: seedpsd_result.rc == 0

    - name: Confirm simulation completed
      ansible.builtin.debug:
        msg: "seedpsd-cli simulation completed successfully on {{ inventory_hostname }}"
      when: seedpsd_result.rc == 0
