- name: Track latest job from each JSON file per host
  hosts: all
  gather_facts: false

  vars:
    latest_jobs: []

  tasks:
    - name: Gather remote environment variables
      setup:
        filter: ansible_env

    - name: Find job tracking files in ~/.dmtri/jobs/{{ inventory_hostname }}
      find:
        paths: "{{ ansible_env.HOME }}/.dmtri/jobs/{{ inventory_hostname }}"
        patterns: "*.json"
        file_type: file
      register: job_files
      ignore_errors: true

    - name: Fail if no job files were found
      fail:
        msg: "No job tracking files found for {{ inventory_hostname }}"
      when: job_files.files | length == 0

    - name: Load and decode each job file
      slurp:
        src: "{{ item.path }}"
      loop: "{{ job_files.files }}"
      register: loaded_jobs
      loop_control:
        label: "{{ item.path }}"

    - name: Try parsing and selecting latest job from each file
      set_fact:
        latest_jobs: "{{ latest_jobs + [ (item.content | b64decode | from_json | sort(attribute='created_at'))[-1] ] }}"
      failed_when: false
      loop: "{{ loaded_jobs.results }}"
      loop_control:
        label: "{{ item.source }}"
      when: item.content is defined

    - name: Print latest job from each file
      debug:
        msg: >-
          {{ '%-18s' | format(item.host | default(inventory_hostname)) }}
          {{ '%-28s' | format(item.job_id) }}
          {{ '%-22s' | format((item.type ~ ' (' ~ item.subtype ~ ')') if item.subtype is defined else item.type) }}
          {{ '%-10s' | format(item.network | default('—')) }}
          {{ '%-10s' | format(item.station | default('—')) }}
          {{ '%-20s' | format(item.start | default('—')) }}
          {{ '%-20s' | format(item.end | default('—')) }}
          {{ '(MANUAL)' if item.job_id is search('^manual-') else '(AUTO)' }} ✅ From file
      loop: "{{ latest_jobs }}"
      loop_control:
        label: "{{ item.job_id }}"
