- name: Refresh WFCatalog metrics for a given network/station/time range
  hosts: wf_catalogue
  gather_facts: no

  vars:
    venv_python: "{{ collector_dir }}/.env/bin/python3.11"
    collector_script: "WFCatalogCollector.py"
    config_path: "{{ collector_dir }}/config.json"
    archive_root: "/home/sysop/iso_sds"

  tasks:
    - name: Ensure required variables are provided
      fail:
        msg: "You must pass 'network', 'station', 'starttime', and 'endtime' via -e"
      when: network is not defined or station is not defined or starttime is not defined or endtime is not defined

    - name: Set defaults for optional variables
      set_fact:
        network: "{{ network | default('*') }}"
        station: "{{ station | default('*') }}"
        location: "{{ location | default('*') }}"
        channel: "{{ channel | default('*') }}"
        file_suffix: 'D'

    - name: Set sanitized names for logging
      set_fact:
        net_str: "{{ (network if network is string else network | join('_')) | regex_replace('[^a-zA-Z0-9_*]', '') }}"
        sta_str: "{{ (station if station is string else station | join('_')) | regex_replace('[^a-zA-Z0-9_*]', '') }}"
        start_date: "{{ starttime | regex_replace('T.*$', '') }}"
        end_date: "{{ endtime | regex_replace('T.*$', '') }}"

    - name: "[Discovery] Find files via targeted SDS path generation"
      shell:
        cmd: |
          {{ venv_python }} -c "
          import os, datetime, json, glob, fnmatch
          
          # Load config to get ARCHIVE_ROOT and STRUCTURE
          with open('config.json') as f: cfg = json.load(f)
          root = cfg.get('ARCHIVE_ROOT', '.')
          struct = cfg.get('STRUCTURE', 'SDS')
          
          # Match patterns from Ansible
          def get_list(env_var):
              val = os.environ.get(env_var, '[]')
              try:
                  data = json.loads(val)
                  return data if isinstance(data, list) else [data]
              except:
                  return [val] if val else []

          networks = get_list('DMTRI_NET')
          stations = get_list('DMTRI_STA')
          channels = get_list('DMTRI_CHAN')
          
          # Fix start/end parsing to handle possible timezone offset from isoformat()
          start_str = '{{ starttime }}'.split('+')[0].split('Z')[0]
          end_str = '{{ endtime }}'.split('+')[0].split('Z')[0]
          start = datetime.datetime.strptime(start_str, '%Y-%m-%dT%H:%M:%S')
          end = datetime.datetime.strptime(end_str, '%Y-%m-%dT%H:%M:%S')
          
          found = []
          curr = start
          while curr <= (end + datetime.timedelta(seconds=1)):
              year, doy = curr.strftime('%Y'), curr.strftime('%j')
              
              for net_p in networks:
                for sta_p in stations:
                  for chan_p in channels:
                    if struct == 'SDS':
                        # root/year/net/sta/chan.type/net.sta.loc.chan.type.year.doy
                        pattern = os.path.join(root, year, net_p, sta_p, f'{chan_p}.*', f'{net_p}.{sta_p}.*.{chan_p}.*.{year}.{doy}')
                        found.extend(glob.glob(pattern))
                    elif struct == 'ODC':
                        # root/year/doy/sta.chan.net.year.doy
                        pattern = os.path.join(root, year, doy, f'{sta_p}.{chan_p}.{net_p}.{year}.{doy}')
                        found.extend(glob.glob(pattern))
              
              curr += datetime.timedelta(days=1)
          
          # Remove duplicates and filter by config filters
          found = sorted(list(set(found)))
          white = cfg.get('FILTERS', {}).get('WHITE', ['*'])
          black = cfg.get('FILTERS', {}).get('BLACK', [])
          
          final = []
          for f in found:
              base = os.path.basename(f)
              if any(fnmatch.fnmatch(base, w) for w in white):
                  if not any(fnmatch.fnmatch(base, b) for b in black):
                      final.append(f)
          
          print(json.dumps(final))
          "
        chdir: "{{ collector_dir }}"
      args:
        executable: /bin/bash
      environment:
        DMTRI_NET: "{{ network | to_json }}"
        DMTRI_STA: "{{ station | to_json }}"
        DMTRI_CHAN: "{{ channel | to_json }}"
      register: discovery_result

    - name: "[Discovery] Set file list"
      set_fact:
        all_files: "{{ discovery_result.stdout | from_json }}"

    - name: "[Discovery] Check if files were found"
      fail:
        msg: "No files found for {{ network }}.{{ station }} between {{ starttime }} and {{ endtime }}."
      when: all_files | length == 0

    - name: Create temporary workspace for isolation
      tempfile:
        state: directory
        suffix: wfcatalog
      register: temp_workspace

    - name: Prepare isolated workspace
      copy:
        src: "{{ collector_dir }}/{{ item }}"
        dest: "{{ temp_workspace.path }}/{{ item }}"
        remote_src: true
      loop:
        - "{{ collector_script }}"
        - "config.json"

    - name: Process files in batches
      shell:
        cmd: |
          set -o pipefail
          LOG_FILE="WFCatalog-refresh-{{ net_str }}-{{ sta_str }}-{{ start_date }}-{{ end_date }}-batch-{{ ansible_loop.index }}.log"
          {{ venv_python }} {{ collector_script }} \
            --list '{{ item | to_json }}' \
            --update --force --csegs --flags \
            --stdout 2>&1 | tee "$LOG_FILE"
        chdir: "{{ temp_workspace.path }}"
      args:
        executable: /bin/bash
      environment:
        PYTHONPATH: "{{ collector_dir }}"
        PYTHONUNBUFFERED: "1"
      register: batch_results
      loop: "{{ all_files | batch(100) | list }}"
      loop_control:
        extended: yes
        label: "Batch {{ ansible_loop.index }} ({{ item | length }} files)"


    - name: Ensure permanent log directory exists
      file:
        path: "{{ collector_dir }}/log"
        state: directory
        mode: '0755'

    - name: Persist batch log
      shell: "cp {{ temp_workspace.path }}/*.log {{ collector_dir }}/log/"
      args:
        executable: /bin/bash
      ignore_errors: true

    - name: Remove temporary workspace
      file:
        path: "{{ temp_workspace.path }}"
        state: absent
      when: temp_workspace.path is defined

    - name: Ensure ~/.dmtri/jobs/{{ inventory_hostname }} directory exists
      file:
        path: "~/.dmtri/jobs/{{ inventory_hostname }}"
        state: directory
        mode: '0755'

    - name: Load existing job list
      slurp:
        src: "~/.dmtri/jobs/{{ inventory_hostname }}/wfcatalog.json"
      register: job_file
      ignore_errors: true

    - name: Parse job list
      set_fact:
        job_list: "{{ (job_file.content | b64decode | from_json) if job_file.content is defined else [] }}"

    - name: Define new job entry
      set_fact:
        new_job: {
          "type": "wfcatalog_refresh",
          "job_id": "refresh-{{ lookup('pipe', 'date +%s') }}",
          "host": "{{ inventory_hostname }}",
          "network": "{{ network }}",
          "station": "{{ station }}",
          "start": "{{ starttime }}",
          "end": "{{ endtime }}",
          "files_processed": "{{ all_files | length }}",
          "batches": "{{ batch_results.results | length }}",
          "created_at": "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"
        }

    - name: Append new job and save
      copy:
        content: "{{ (job_list + [new_job]) | to_nice_json }}"
        dest: "~/.dmtri/jobs/{{ inventory_hostname }}/wfcatalog.json"

    - name: Read last batch log for summary
      slurp:
        src: "{{ collector_dir }}/log/WFCatalog-refresh-{{ net_str }}-{{ sta_str }}-{{ start_date }}-{{ end_date }}-batch-1.log"
      register: last_batch_log
      ignore_errors: true

    - name: "DISPLAY WFCATALOG REFRESH RESULTS"
      debug:
        msg:
          - "========================================"
          - " WFCatalog Refresh — Results"
          - "========================================"
          - "  Status   : {{ 'SUCCESS' if batch_results.results | map(attribute='rc') | sum == 0 else 'PARTIAL FAILURE' }}"
          - "  Files    : {{ all_files | length }}"
          - "  Batches  : {{ batch_results.results | length }}"
          - "  Log Dir  : {{ collector_dir }}/log"
          - "----------------------------------------"
          - "  Summary  :"
          - "{{ (last_batch_log.content | b64decode | regex_findall('Total records: (.*)', multiline=True) | length > 0) | ternary((last_batch_log.content | b64decode | regex_findall('Total records: (.*)', multiline=True)) | first, 'Summary info not found in log') }}"
          - "  (Job ID: {{ new_job.job_id }})"
          - "========================================"