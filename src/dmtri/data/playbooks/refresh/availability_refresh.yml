- name: "Run ws-availability availability update (Webservice Command: Docker Restart)"
  hosts: ws_availability
  gather_facts: false

  tasks:

    - name: "Run availability update (Restarting Cacher Container)"
      shell: "docker restart fdsnws-availability-cacher"
      register: restart_result

    - name: "DISPLAY RESTART STATUS"
      debug:
        msg:
          - "========================================"
          - " Availability Refresh — Docker Status"
          - "========================================"
          - "  Container   : fdsnws-availability-cacher"
          - "  Status      : {{ 'Restarted successfully' if restart_result.rc == 0 else 'FAILED' }}"
          - "  Exit Code   : {{ restart_result.rc }}"
          - "========================================"

    # ---------------------------------------------------------------
    # JOB TRACKING
    # ---------------------------------------------------------------

    - name: Ensure ~/.dmtri/jobs/{{ inventory_hostname }} directory exists
      file:
        path: "~/.dmtri/jobs/{{ inventory_hostname }}"
        state: directory
        mode: '0755'

    - name: "Load existing job list (if exists)"
      slurp:
        src: "~/.dmtri/jobs/{{ inventory_hostname }}/availability.json"
      register: job_file
      ignore_errors: true

    - name: "Parse job list or default to []"
      set_fact:
        job_list: >-
          {{ (job_file.content | b64decode | from_json) if job_file.content is defined else [] }}

    - name: Define new job entry
      set_fact:
        new_job: {
          "type": "availability_refresh",
          "job_id": "restart-{{ lookup('pipe', 'date +%s') }}",
          "host": "{{ inventory_hostname }}",
          "mode": "full_restart",
          "rc": "{{ restart_result.rc | default('unknown') }}",
          "created_at": "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"
        }

    - name: "Save updated job list"
      copy:
        content: "{{ (job_list + [new_job]) | to_nice_json }}"
        dest: "~/.dmtri/jobs/{{ inventory_hostname }}/availability.json"

    - name: "DISPLAY AVAILABILITY REFRESH RESULTS"
      debug:
        msg:
          - "========================================"
          - " Availability Refresh — Results"
          - "========================================"
          - "  Status   : {{ 'SUCCESS' if restart_result.rc == 0 else 'FAILED' }}"
          - "  Job ID   : {{ new_job.job_id }}"
          - "  Message  : The cacher container has been restarted and is now updating its internal database."
          - "========================================"
