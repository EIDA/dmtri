- name: "Track all dmtri async jobs across all hosts"
  hosts: all
  gather_facts: false

  tasks:

    - name: "Gather remote environment variables"
      setup:
        filter: ansible_env

    - name: "Find job tracking files in remote ~/.dmtri/jobs/{{ inventory_hostname }}/"
      find:
        paths: "{{ ansible_env.HOME }}/.dmtri/jobs/{{ inventory_hostname }}"
        patterns: "*.json"
        file_type: file
      register: job_files
      ignore_errors: true

    - name: "Fail if no job files were found on this host"
      fail:
        msg: "No job tracking files found for {{ inventory_hostname }}"
      when: job_files.files | length == 0

    - name: "Load job files"
      slurp:
        src: "{{ item.path }}"
      loop: "{{ job_files.files }}"
      register: loaded_job_data
      loop_control:
        label: "{{ item.path }}"

    - name: "Parse and combine job lists"
      set_fact:
        combined_jobs: >-
          {{
            loaded_job_data.results
            | map(attribute='content')
            | map('b64decode')
            | map('from_json')
            | flatten
          }}

    - name: "Check async job statuses (IDs starting with j)"
      async_status:
        jid: "{{ item.job_id }}"
      loop: "{{ combined_jobs | selectattr('job_id', 'match', '^j\\d+') | list }}"
      register: job_statuses
      loop_control:
        label: "{{ item.job_id }}"

    - name: "Build manual job results (IDs like manual-xxxx)"
      set_fact:
        manual_jobs: >-
          {{
            combined_jobs
            | selectattr('job_id', 'match', '^manual-')
            | map('combine', {'status': '✅ Manual (not tracked)'})
            | list
          }}

    - name: "Merge async and manual job results"
      set_fact:
        all_job_results: >-
          {{
            (job_statuses.results | default([])) + manual_jobs
          }}

    - name: "Print concise job summary per host"
      debug:
        msg: >-
          {{ '%-18s' | format(item.item.host | default(inventory_hostname)) }}
          {{ '%-28s' | format(item.item.job_id if item.item is defined else item.job_id) }}
          {{ '%-22s' | format((item.item.type if item.item is defined else item.type) ~
                              (' (' ~ (item.item.subtype if item.item is defined else item.subtype) ~ ')' 
                               if (item.item.subtype if item.item is defined else item.subtype) is defined else '')) }}
          {{ '%-10s' | format(item.item.network | default('—')) }}
          {{ '%-10s' | format(item.item.station | default('—')) }}
          {{ '%-20s' | format(item.item.start | default('—')) }}
          {{ '%-20s' | format(item.item.end | default('—')) }}
          {{ (
              item.status | default(
                item.started is defined and item.started | bool |
                  ternary(
                    item.finished | default(false) | bool | ternary('✅ Finished', '⏳ Running'),
                    '❌ Failed'
                  )
              )
          ) }}
      loop: "{{ all_job_results }}"
      loop_control:
        label: "{{ item.item.job_id if item.item is defined else item.job_id }}"
