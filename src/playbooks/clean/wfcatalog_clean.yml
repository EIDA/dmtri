- name: Run WFCatalog Clean
  hosts: wf_catalogue
  gather_facts: false

  vars:
    venv_python: ".env/bin/python3.11"
    collector_script: "WFCatalogCollector.py"
    config_path: "{{ collector_dir }}/config.json"

  tasks:

    - name: Ensure required variables are provided
      fail:
        msg: "You must pass 'network', 'station', 'starttime', and 'endtime' via -e"
      when: network is not defined or station is not defined or starttime is not defined or endtime is not defined

    - name: Compute basic derived values
      set_fact:
        start_date: "{{ starttime | regex_replace('T.*$', '') }}"
        end_date: "{{ endtime | regex_replace('T.*$', '') }}"
        year: "{{ starttime[0:4] }}"

    - name: Compute range and paths
      set_fact:
        range_days: >-
          {{
            (
              (endtime | to_datetime('%Y-%m-%dT%H:%M:%S')) -
              (starttime | to_datetime('%Y-%m-%dT%H:%M:%S'))
            ).days + 1
          }}
        log_path: "{{ collector_dir }}/log/WFCatalog-{{ network }}-{{ station }}-{{ start_date }}-{{ end_date }}.log"
        custom_archive_root: "/home/sysop/iso_sds/{{ year }}/{{ network }}/{{ station }}"

    - name: Check if backup exists
      stat:
        path: "{{ config_path }}.back"
      register: config_backup

    - name: Backup original config.json
      copy:
        src: "{{ config_path }}"
        dest: "{{ config_path }}.back"
        remote_src: true
      when: not config_backup.stat.exists

    - name: Update ARCHIVE_ROOT in config.json
      replace:
        path: "{{ config_path }}"
        regexp: '"ARCHIVE_ROOT":\s*".*?"'
        replace: '"ARCHIVE_ROOT": "{{ custom_archive_root }}"'

    - name: Run WFCatalogCollector asynchronously
      shell: |
        cd {{ collector_dir }} && \
        {{ venv_python }} {{ collector_script }} \
        --flags --csegs \
        --logfile {{ log_path }} \
        --date {{ start_date }} \
        --range {{ range_days }} \
        --delete --stdout
      args:
        executable: /bin/bash
      async: 3600
      poll: 0
      register: wfcatalog_async

    - name: "Track job: append to {{ collector_dir }}/.dmtri_jobs.json"
      block:
        - name: Load existing job list
          slurp:
            src: "{{ collector_dir }}/.dmtri_jobs.json"
          register: job_file
          ignore_errors: true

        - name: Parse or start new job list
          set_fact:
            job_list: >-
              {{
                (job_file.content | b64decode | from_json)
                if job_file is defined and job_file.content is defined
                else []
              }}

        - name: Create job record
          set_fact:
            new_job: {
              "type": "wfcatalog",
              "job_id": "{{ wfcatalog_async.ansible_job_id }}",
              "host": "{{ inventory_hostname }}",
              "network": "{{ network }}",
              "station": "{{ station }}",
              "start": "{{ starttime }}",
              "end": "{{ endtime }}",
              "created_at": "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"
            }

        - name: Save updated job list
          copy:
            content: "{{ (job_list + [new_job]) | to_nice_json }}"
            dest: "{{ collector_dir }}/.dmtri_jobs.json"

    - name: Restore original config.json
      copy:
        src: "{{ config_path }}.back"
        dest: "{{ config_path }}"
        remote_src: true