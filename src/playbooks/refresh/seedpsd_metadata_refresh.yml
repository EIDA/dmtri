- name: Run seedpsd-cli metadata update in simulate mode
  hosts: seedpsd_nodes
  gather_facts: false

  vars:
    description: "Run simulated metadata update using seedpsd-cli"

  tasks:

    - name: Collect remote environment variables
      setup:
        filter: ansible_env

    - name: Ensure required variables are provided
      fail:
        msg: "You must pass 'network', 'station', 'starttime', and 'endtime' via -e"
      when: network is not defined or station is not defined or starttime is not defined or endtime is not defined

    - name: Ensure 'seedpsd_dir' is defined for this host
      fail:
        msg: "'seedpsd_dir' must be set in the inventory for {{ inventory_hostname }}"
      when: seedpsd_dir is not defined

    - name: Compute derived values
      set_fact:
        start_date: "{{ starttime | regex_replace('T.*$', '') }}"
        end_date: "{{ endtime | regex_replace('T.*$', '') }}"
        year: "{{ starttime[0:4] }}"
        subtype: "metadata"

    - name: Run seedpsd-cli metadata update in simulate mode
      shell: >
        cd {{ seedpsd_dir }} &&
        uv run seedpsd-cli metadata update
        --network {{ network }}
        --station {{ station }}
        --location '{{ location | default('*') }}'
        --channel '{{ channel | default('*') }}'
        --simulate
      args:
        executable: /bin/bash
      register: metadata_result

    - name: Show metadata update output
      debug:
        var: metadata_result.stdout_lines

    - name: Set remote job directory path
      set_fact:
        job_dir: "{{ ansible_env.HOME }}/.dmtri/jobs/{{ inventory_hostname }}"

    - name: Set remote job file path
      set_fact:
        job_path: "{{ job_dir }}/seedpsd-{{ subtype }}.json"

    - name: Ensure job directory exists
      file:
        path: "{{ job_dir }}"
        state: directory
        mode: '0755'

    - name: Define new job entry
      set_fact:
        new_job: {
          "type": "seedpsd",
          "subtype": "{{ subtype }}",
          "job_id": "manual-{{ lookup('pipe', 'date +%s') }}",
          "host": "{{ inventory_hostname }}",
          "network": "{{ network }}",
          "station": "{{ station }}",
          "start": "{{ starttime }}",
          "end": "{{ endtime }}",
          "created_at": "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"
        }

    - name: Save latest metadata job (overwrite)
      copy:
        content: "{{ [new_job] | to_nice_json }}"
        dest: "{{ job_path }}"
