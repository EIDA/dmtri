- name: Find SDS files and run seedpsd-cli with accurate SDS path and DOY matching across years
  hosts: seedpsd_nodes
  gather_facts: false

  tasks:

    - name: Collect remote environment variables
      setup:
        filter: ansible_env

    - name: Ensure 'seedpsd_dir' is defined for this host
      fail:
        msg: "'seedpsd_dir' must be set in the inventory for {{ inventory_hostname }}"
      when: seedpsd_dir is not defined

    - name: Set variables
      set_fact:
        file_suffix: 'D'
        network: "{{ network | default('*') }}"
        station: "{{ station | default('*') }}"
        location: "{{ location | default('') }}"
        channel: "{{ channel | default('*') }}"
        subtype: "data"

    - name: Compute list of years to search
      set_fact:
        year_range: >-
          {{ range(
              (starttime | regex_replace('T.*$', '') | to_datetime('%Y-%m-%d')).year,
              (endtime | regex_replace('T.*$', '') | to_datetime('%Y-%m-%d')).year + 1
          ) | list }}

    - name: Generate list of -name patterns for DOY matching across years
      shell: |
        start="{{ starttime | regex_replace('T.*$', '') }}"
        end="{{ endtime | regex_replace('T.*$', '') }}"
        tmp_list=""

        start_epoch=$(date -d "$start" +%s)
        end_epoch=$(date -d "$end" +%s)
        days_diff=$(( (end_epoch - start_epoch) / 86400 ))

        for i in $(seq 0 $days_diff); do
          current_date=$(date -d "@$((start_epoch + i * 86400))" +%Y.%j)
          year=$(echo "$current_date" | cut -d. -f1)
          doy=$(echo "$current_date" | cut -d. -f2)
          tmp_list="$tmp_list -name '*{{ file_suffix }}.${year}.${doy}' -o"
        done

        echo "${tmp_list% -o}"
      args:
        executable: /bin/bash
      register: name_patterns
      changed_when: false

    - name: Set final find arguments
      set_fact:
        find_args: "{{ name_patterns.stdout }}"

    - name: Run find in correct SDS folders per year
      shell: >
        find iso_sds/{{ item }}/{{ network }}/{{ station }}/{{ channel }}.{{ file_suffix }}/ -type f {{ find_args }}
      loop: "{{ year_range }}"
      args:
        executable: /bin/bash
      register: find_results
      changed_when: false
      ignore_errors: true

    - name: Collect found SDS file paths
      set_fact:
        all_files: >-
          {{ find_results.results | map(attribute='stdout_lines') | flatten | list }}

    - name: Show matched file paths (debug)
      debug:
        var: all_files

    - name: Show count of matched files
      debug:
        msg: "Total matched files: {{ all_files | length }}"

    - name: Run seedpsd-cli asynchronously using process substitution
      shell: |
        cd {{ seedpsd_dir }} &&
        uv run seedpsd-cli data mseed --simulate --list <(
          {% for f in all_files %}
          echo {{ f | quote }}
          {% endfor %}
        )
      args:
        executable: /bin/bash
      async: 3600
      poll: 0
      register: seedpsd_async

    - name: Set job directory path
      set_fact:
        job_dir: "{{ ansible_env.HOME }}/.dmtri/jobs/{{ inventory_hostname }}"

    - name: Set job file path
      set_fact:
        job_path: "{{ job_dir }}/seedpsd-{{ subtype }}.json"

    - name: Ensure job directory exists
      file:
        path: "{{ job_dir }}"
        state: directory
        mode: '0755'

    - name: Define new job entry
      set_fact:
        new_job: {
          "type": "seedpsd",
          "subtype": "{{ subtype }}",
          "job_id": "{{ seedpsd_async.ansible_job_id }}",
          "host": "{{ inventory_hostname }}",
          "network": "{{ network }}",
          "station": "{{ station }}",
          "start": "{{ starttime }}",
          "end": "{{ endtime }}",
          "created_at": "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"
        }

    - name: Save latest job (overwrite file for this subtype)
      copy:
        content: "{{ [new_job] | to_nice_json }}"
        dest: "{{ job_path }}"
