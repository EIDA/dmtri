- name: Run ws-availability availability update
  hosts: ws_availability
  gather_facts: false

  vars:
    mongo_script: main.js

  tasks:

    - name: Ensure required vars are provided
      fail:
        msg: "You must pass 'network', 'station', 'starttime', and 'endtime' via -e"
      when: network is not defined or station is not defined or starttime is not defined or endtime is not defined

    - name: Convert starttime/endtime to date-only format
      set_fact:
        start_date: "{{ starttime | regex_replace('T.*$', '') }}"
        end_date: "{{ endtime | regex_replace('T.*$', '') }}"

    - name: Preview full mongosh command for verification
      debug:
        msg: >
          cd {{ availability_dir }} &&
          mongosh -u {{ mongo_user }} -p {{ mongo_pass }}
          --authenticationDatabase {{ mongo_authdb }}
          --eval "networks='{{ network }}'; stations='{{ station }}'; start='{{ start_date }}'; end='{{ end_date }}'" {{ mongo_script }}

    - name: Run availability script via mongosh
      shell: >
        cd {{ availability_dir }} &&
        mongosh -u {{ mongo_user }} -p {{ mongo_pass }}
        --authenticationDatabase {{ mongo_authdb }}
        --eval "networks='{{ network }}'; stations='{{ station }}'; start='{{ start_date }}'; end='{{ end_date }}'" {{ mongo_script }}
      args:
        executable: /bin/bash
      register: availability_result

    - name: Show mongosh output
      debug:
        var: availability_result.stdout_lines
