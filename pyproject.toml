[project]
name = "dmtri"
version = "0.1.3"
description = "CLI tool for triggering datacenter metadata updates"
authors = [{ name = "Nikos Sokos", email = "nsokos@noa.gr" }]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "ansible>=6.7.0",
    "ansible-runner>=2.3.6",
    "appdirs>=1.4.4",
    "pytest>=8.3.5",
    "pytest-cov>=5.0.0",
    "requests",
    "tomli>=2.2.1",
]
readme = "README.md"
requires-python = ">=3.8"
[dependency-groups]
dev = [
  "pytest",
  "pytest-cov"
]


[project.scripts]
dmtri = "dmtri.cli:main"

[tool.setuptools.package-data]
dmtri = ["data/**/*"]

[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"
