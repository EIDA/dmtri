name: Run Tests and Update Coverage Badge

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install UV
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Run Pytest with Coverage
        run: |
          uv run --python ${{ matrix.python-version }} pytest --cov=src --cov-report=term --cov-report=xml

      # The badge is generated once, from a single interpreter, to avoid
      # matrix jobs racing to commit badges/coverage.svg.
      - name: Generate SVG Coverage Badge
        if: matrix.python-version == '3.13'
        uses: tj-actions/coverage-badge-py@v2
        with:
          output: coverage.svg

      - name: Move badge to badges/ directory
        if: matrix.python-version == '3.13'
        run: |
          mkdir -p badges
          mv coverage.svg badges/coverage.svg

      - name: Commit and push badge
        if: github.ref == 'refs/heads/main' && matrix.python-version == '3.13'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add badges/coverage.svg
          git commit -m "Update coverage badge" || echo "No changes to commit"
          git push origin main
