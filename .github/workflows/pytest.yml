name: Run Tests and Update Coverage Badge

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install UV
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Run Pytest and Generate Coverage Report
        run: |
          uv run pytest --cov=src --cov-report=term --cov-report=xml --cov-report=svg

      - name: Move coverage badge to badges directory
        run: |
          mkdir -p badges
          mv coverage.svg badges/coverage.svg

      - name: Commit and push coverage badge to main
        if: github.ref == 'refs/heads/main'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add badges/coverage.svg
          git commit -m "Update coverage badge" || echo "No changes to commit"
          git push origin main
