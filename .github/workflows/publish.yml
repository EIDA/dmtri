name: Publish Python Package

on:
  push:
    branches: [main]
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-alpha.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'
  pull_request:
    branches: [main]

jobs:
  release-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install UV
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Build Package with UV
        run: |
          uv build

      - name: Upload Built Package
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [release-build]
    permissions:
      id-token: write  # OIDC auth for PyPI
      contents: read
    steps:
      - name: Retrieve Built Package
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish to PyPI
        id: publish
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@v1.12.4

      - name: Notify if PyPI publish failed
        if: steps.publish.outcome == 'failure'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "::warning title=PyPI publish failed::Trusted publisher not configured for the 'dmtri' project on PyPI."
          {
            echo "## ⚠️ PyPI publish failed — trusted publisher not configured"
            echo ""
            echo "The build and GitHub release for \`${REF_NAME}\` succeeded, but the upload to PyPI was rejected (\`invalid-publisher\`)."
            echo ""
            echo "**@Jonathan (PyPI admin): please rebuild the GitHub Actions trusted publisher for the \`dmtri\` project.**"
            echo ""
            echo "Settings page: https://pypi.org/manage/project/dmtri/settings/publishing/"
            echo ""
            echo "Configure it with exactly:"
            echo "- **Owner:** \`EIDA\`"
            echo "- **Repository:** \`dmtri\`"
            echo "- **Workflow:** \`publish.yml\`"
            echo "- **Environment:** _(leave blank)_"
            echo ""
            echo "Once configured, re-run this workflow to publish \`${REF_NAME}\` (the version number is still free)."
          } >> "$GITHUB_STEP_SUMMARY"

  github-release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [release-build]
    permissions:
      contents: write
    steps:
      - name: Retrieve Built Package
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-rc') }}
